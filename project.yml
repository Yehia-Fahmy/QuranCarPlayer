# XcodeGen specification. Regenerate the project with: Scripts/generate-project.sh
# The generated QuranCarPlayer.xcodeproj is committed so the project opens without XcodeGen.
name: QuranCarPlayer
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  QuranCarPlayerCore:
    path: Packages/QuranCarPlayerCore

targets:
  QuranCarPlayer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        # Audio fixtures are copied as plain bundle resources (not an asset catalog).
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QuranCarPlayer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    entitlements:
      path: App/QuranCarPlayer.entitlements
      properties:
        com.apple.developer.carplay-audio: true
    dependencies:
      - package: QuranCarPlayerCore
    settings:
      base:
        PRODUCT_NAME: QuranCarPlayer
        PRODUCT_BUNDLE_IDENTIFIER: $(QCP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(QCP_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO

  QuranCarPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: QuranCarPlayer
      - package: QuranCarPlayerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QCP_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(QCP_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  QuranCarPlayer:
    shared: true
    build:
      targets:
        QuranCarPlayer: all
        QuranCarPlayerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: QuranCarPlayerTests
          parallelizable: false
    profile:
      config: Release
    archive:
      config: Release
